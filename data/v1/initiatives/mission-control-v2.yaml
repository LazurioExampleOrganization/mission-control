schema_version: agentmint.mission_control.initiative.v1
id: init-2026-05-23-001
title: Mission Control V2 (jádro souborové databáze podle Linearu)
status: active
owner: jannovak
context: |
  Mission Control přechází z V1 nástroje jen pro plány na operační jádro podle
  Linearu. V2 přidává souborovou databázi pod data/v1/, plnohodnotné entity
  (úkol, projekt, iniciativa, cyklus, pohled, pracovní postup, tým, štítek,
  příjem, aktualizace) a postupně i cockpit UI podle Linearu. Plans/ zůstávají
  jako strategická vrstva pro tvarování práce, ze které vznikají iniciativy,
  projekty a úkoly.

  Tahle iniciativa drží zastřešující kontext V2 a propojuje milníky: schémata
  a databáze (fáze 1), UI cockpit (fáze 2), úklid bridge do task ledgerů
  (fáze 3).
goals:
  - Mít YAML-first souborovou databázi pro celé plánovací jádro AgentMintu podle Linearu.
  - UI agentního cockpitu, ne dashboardu.
  - Zachovat plans/ jako vstupní strategickou vrstvu.
  - Postupně zúžit roli TODO.tasks.json na výstupní realizační linku.
