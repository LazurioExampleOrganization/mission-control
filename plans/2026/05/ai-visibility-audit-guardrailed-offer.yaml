    summary: Definovat povolené zdroje, zakázané taktiky, citace, confidence a hranice doporučení před návrhem nabídky.
    priority: medium
    tags:
      - guardrails
      - visibility-audit
      - reputational-risk
    acceptance_criteria:
      - Guardrails explicitně zakazují fake accounts, stealth posting a manipulaci recenzí.
      - Každé doporučení v reportu musí mít zdroj nebo být označené jako hypotéza.
      - Dokument obsahuje rozhodovací kritérium, kdy audit odmítnout.

