schema_version: agentmint.mission_control.feature_plan.v1
id: plan-2026-05-23-008
title: Launchpad AgentMint design pass
type: feature
status: ready
owner: jannovak
created_at: 2026-05-23
updated_at: 2026-05-23

context: |
  Launchpad zatím působí jako generická GEN2 šablona. AgentMint potřebuje,
  aby lokální control plane vypadal jako pracovní analytický nástroj firmy:
  operating desk pro mechanismy, experimenty, evidence, Mission Control a
  workspace health.

  Grafická úprava nemá vytvořit marketingový hero. Má zpřehlednit první
  obrazovku a přenést AgentMint brand baseline do každodenního nástroje.

goals:
  - Dát Launchpadu jasný AgentMint charakter.
  - Zvýraznit Mission Control jako hlavní plánovací vstup.
  - Zachovat provozní funkce Launchpadu bez rozbití start/stop/doctor flow.
  - Udělat desktop i mobile view profesionální a scanovatelný.

scope:
  in:
    - Topbar s AgentMint identitou a workspace control plane label.
    - Home summary v provozním AgentMint jazyce.
    - Mission Control jako primární/pinned app.
    - App cards s jasnými stavovými signály.
    - CSS tokeny sladěné s AgentMint design baseline.
  out:
    - Marketingová landing page.
    - Dekorativní orby, gradient blobs nebo generické hero ilustrace.
    - Změna core Launchpad API nebo doctor behavioru.

acceptance_criteria:
  - Na první obrazovce je zřejmé, že jde o AgentMint workspace, ne template.
  - Mission Control je viditelné nebo výrazně zvýrazněné bez hledání.
  - Guide a Design System jsou sekundární podpůrné nástroje.
  - Desktop a mobile screenshoty nemají text overflow ani překryvy.
  - Start/stop app tlačítka dál fungují.

risk_notes:
  - Příliš výrazná stylizace nesmí snížit použitelnost každodenního dashboardu.
  - Launchpad nesmí přijít o generic core funkce, které bude chtít doctor a workspace runtime.
  - Texty musí být provozní, ne sales copy.

decisions:
  - date: 2026-05-23
    decision: Design pass má udělat AgentMint operating desk, ne landing page.
    rationale: Launchpad je interní nástroj pro opakované řízení práce, ne veřejný web.

