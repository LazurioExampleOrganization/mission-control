planning_target:
  scope: agentmint-mission-control
  todo_tasks_path: mission-control/TODO.tasks.json
proposed_tasks:
  - title: Dovést root-level Mission Control work board migraci do ověřeného stavu
    summary: Dokončit přesun Mission Controlu na root-level repo, přidat work board nad task ledgery, aktualizovat reference a ověřit Launchpad smoke test.
    priority: high
    tags:
      - root-repo
      - work-board
      - launchpad
    acceptance_criteria:
      - Launchpad objeví Mission Control z root-level manifest slotu.
      - Work board API vrací TODO/DONE/ISSUES sloupce.
      - UI ukazuje planning coverage a odkazy na plány.
      - Build, registry testy a workspace task validace projdou.
todo_outputs:
  - task-2026-05-23-007
decisions:
  - date: 2026-05-23
    decision: Mission Control patří do rootu workspace jako control-plane repo.
    rationale: Role Mission Controlu je plánování a orchestrace celé agendy workspace, takže je stejné vrstvy jako Launchpad nebo Infra, ne doménový business modul.
  - date: 2026-05-23
    decision: První work board bude read-only scanner filesystem ledgerů.
    rationale: Nejdřív potřebujeme pravdivě vidět stav práce a planning coverage; editace a role-based pravidla můžou přijít až po ověření core modelu.
outcome: |-
  Mission Control byl přesunut z `modules/mission-control/` na root-level `mission-control/` a inicializovaný jako lokální nested Git repo. Launchpad registry umí objevit root-level manifest slot a Mission Control běží na původním portu 5693.

  V1 UI má novou Work board sekci pro Workspace Admina, Správce Workspace a Power Usery. Server endpoint `/api/work-board` skenuje `TODO.tasks.json`, `DONE.tasks.json` a `ISSUES.open.json` napříč workspace, skládá kanban sloupce a ukazuje planning coverage. Smoke test potvrdil 11 validních plánů, 14 TODO položek, 2 open issues a žádné invalidní UI bloky.
