  - task-2026-05-23-004
  - task-2026-05-23-005
decisions:
  - date: 2026-05-23
    decision: Mission Control vývoj bude plánovaný v Mission Controlu samotném.
    rationale: Dogfood loop ověřuje, že nástroj umí držet strategický kontext, materializovat TODO a vracet evidence zpět do plánu.
  - date: 2026-05-23
    decision: Před monetizační prací má prioritu planning core.
    rationale: AgentMint potřebuje nejdřív stabilní místo pro strategii, rozhodnutí a rozpad práce, jinak se business kontext rozpadne mezi chat, research a task ledgery.
