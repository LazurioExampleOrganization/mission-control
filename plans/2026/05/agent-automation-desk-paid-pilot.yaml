proposed_tasks:
  - title: Schválit parametry Agent Automation Desk pilotu
    summary: Připravit rozhodovací podklad pro cenu, ICP, prospect kritéria a hranice ručního outreach testu.
    priority: high
    tags:
      - monetization
      - approval
      - pilot
    acceptance_criteria:
      - Je zapsaná finální pilot cena nebo explicitní price test.
      - Je zapsaný první ICP segment a exclusion criteria.
      - Je jasné, kdo může být osloven v první vlně.
      - Je zapsáno, které externí akce čekají na lidské potvrzení.
    risk_notes:
      - Bez schválení se nesmí odeslat žádný outreach.
      - Cena nesmí být prezentovaná jako garantovaný business výsledek.
    links:
      - label: Experiment spec
        path: modules/experiments/specs/2026-05-23-agent-automation-desk.md
  - title: Připravit první ručně schválený prospect shortlist
    summary: Vytvořit seznam 10-20 vhodných B2B kontaktů nebo firem podle schválených kritérií, bez neveřejných dat a bez odesílání zpráv.
    priority: high
    tags:
      - prospects
      - outreach-prep
      - first-dollar
    acceptance_criteria:
      - Každý prospect má důvod fitu a veřejný zdroj signálu.
      - Seznam neobsahuje neveřejná zákaznická data ani credentials.
      - U každého prospectu je návrh nejbezpečnějšího kanálu kontaktu.
      - Výstup čeká na lidské schválení před odesláním.
  - title: Připravit run log pro první pilotní iteraci
    summary: Založit konkrétní run log z template a připravit pole pro odpovědi, cally, buying signals, delivery čas a stop/scale rozhodnutí.
    priority: medium
    tags:
      - run-log
      - experiment
      - evidence
    acceptance_criteria:
      - Run log má datum startu, hypotézu, metriku, stop condition a scale condition.
      - Run log odděluje anonymizovanou evidenci od citlivých dat.
      - Je jasné, kam se zapisuje outcome po 14 dnech.
  - title: Schválit a případně publikovat Fiverr workflow triage gig
    summary: Použít připravený Fiverr launch sheet k ručnímu založení úzkého gig pro AI automation workflow triage, bez off-platform plateb, spam automatizací a revenue slibů.
    priority: medium
    tags:
      - fiverr
      - inbound
      - marketplace
      - first-dollar
    acceptance_criteria:
      - Jan potvrdí Fiverr seller onboarding a explicitně schválí publikaci.
      - Gig používá tři fiktivní package ceny [BASIC] / [STANDARD] / [PREMIUM].
      - Gig neobsahuje off-platform payment/contact linky ani zakázané automation claims.
      - Prvních 14 dní má měřit impressions, clicks, kvalifikované zprávy, orders a out-of-scope poptávky.
    risk_notes:
      - Nový seller bez reputace může dostávat šum nebo žádné objednávky; Fiverr není hlavní overnight kanál.
      - Buyer requesty mohou mířit na spam, scraping nebo práci s citlivými daty; tyto requesty se odmítají nebo scopeují až po samostatném approvalu.
    links:
      - label: Fiverr launch sheet
        path: modules/experiments/assets/fiverr-agent-automation-launch-sheet.md
      - label: First dollar channel feasibility
        path: modules/experiments/shortlists/2026-05-23-first-dollar-channel-feasibility.md
