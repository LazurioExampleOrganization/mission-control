        path: AGENTS.md
      - label: Claude Code entrypoint
        path: CLAUDE.md
      - label: Doctor shell
        path: company/scripts/doctor.sh
      - label: Doctor PowerShell
        path: company/scripts/doctor.ps1
decisions:
  - date: 2026-05-23
    decision: "`CLAUDE.md` bude tenký adapter na `AGENTS.md`, ne paralelní agentní manuál."
    rationale: AgentMint potřebuje podporovat Claude Code nativně, ale zachovat jednu operační pravdu pro všechny agenty.
todo_outputs:
  - task-2026-05-23-008
outcome: |-
  Workspace má nově root `CLAUDE.md`, který Claude Code navádí na `AGENTS.md`, povinný preflight, doctor context check a sdílenou `.claude/skills` knihovnu. Root dokumenty a `.claude/README.md` popisují, že `CLAUDE.md` je jen adapter, ne druhý source of truth.

  Doctor v shell i PowerShell variantě nově kontroluje existenci `CLAUDE.md` a základní obsah (`AGENTS.md` + `check-my-context`). Guide lekce 11 vysvětluje rozdíl mezi Codexem, Claude Code a Cursorem v AgentMint kontextu.
