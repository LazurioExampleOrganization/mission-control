  - task-2026-05-23-002

planning_target:
  scope: agentmint-mission-control
  todo_tasks_path: mission-control/TODO.tasks.json

proposed_tasks:
  - title: Dokončit detailní zobrazení strategických polí v UI
    summary: Ujistit se, že Mission Control detail ukazuje scope, risk_notes, decisions, links, todo_outputs, planning_target a proposed_tasks.
    priority: high
    tags:
      - ui
      - mission-control
      - planning
    acceptance_criteria:
      - Detail plánu ukazuje všechna hlavní schema pole.
      - Mobile layout zůstává čitelný.
      - Nevalidní plán ukáže konkrétní chyby.
  - title: Ověřit dry-run export na reálném plánu
    summary: Spustit export-todo-tasks.mjs nad Agent Automation Desk plánem a ověřit, že výstup je validní TODO návrh s planning referencemi.
    priority: high
    tags:
      - export
      - todo
      - validation
    acceptance_criteria:
      - Dry-run vrátí minimálně jeden navržený task.
      - Každý task má source mission-control a planning.plan_id.
      - Script bez --apply nezapisuje do TODO.tasks.json.

