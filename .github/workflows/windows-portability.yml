name: windows portability

# The same gates on Windows, where people run Mission Control on their own
# computers. Only code can break that, so this runs for pull requests that
# change the App, the toolchain or a workflow, and on demand; never after a
# merge to main (Module Standard, CI; MS-14).
on:
  pull_request:
    paths:
      - "app/**"
      - "templates/**"
      - ".github/workflows/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows:
    name: bun run check (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app/v3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run check
