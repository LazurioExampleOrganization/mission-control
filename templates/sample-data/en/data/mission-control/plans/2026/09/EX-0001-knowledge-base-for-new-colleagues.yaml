schema_version: companiesascode.mission_control.plan.v2
id: mcplan-ex-0001
dev_code: EX-0001
title: Knowledge base for new colleagues
status: done
owner: alexmorgan
priority: high
priority_rank: 10
created_at: 2026-09-02
updated_at: 2026-10-06
context: >-
  New colleagues of the example Organization spend their first week asking
  the same questions in chat. The answers exist, but scattered.
current_problem: >-
  There is no single place where a newcomer finds how work is planned, where
  data lives and who decides what.
target_state: >-
  A short, searchable knowledge base that a newcomer reads on day one and that
  agents can cite.
scope:
  in:
    - Onboarding guide with the planning loop
    - Glossary of the Organization's terms
  out:
    - Customer-facing documentation
acceptance_criteria:
  - A newcomer finds the planning loop, the glossary and the owners in under ten minutes.
  - Every page names its owner and the date it was last checked.
validation:
  - Two newcomers complete the onboarding checklist without asking in chat.
decisions:
  - date: 2026-09-10
    decision: The knowledge base is a module of the Organization, not a wiki of one person.
    rationale: Agents and colleagues read the same source.
