title: Znalostní báze pro nové kolegy
status: done
owner: alexmorgan
priority: high
priority_rank: 10
created_at: 2026-09-02
updated_at: 2026-10-06
context: >-
  Noví kolegové ukázkové Organizace tráví první týden tím, že se v chatu ptají
  na stejné věci. Odpovědi existují, ale jsou roztroušené.
current_problem: >-
  Chybí jedno místo, kde nováček najde, jak se plánuje práce, kde jsou data
  a kdo o čem rozhoduje.
target_state: >-
  Krátká znalostní báze s vyhledáváním, kterou nováček přečte první den a na
  kterou se můžou odvolávat i agenti.
scope:
  in:
    - Průvodce zaučením s plánovací smyčkou
    - Slovník pojmů Organizace
  out:
    - Dokumentace pro zákazníky
acceptance_criteria:
  - Nováček najde plánovací smyčku, slovník a vlastníky do deseti minut.
  - Každá stránka uvádí svého vlastníka a datum poslední kontroly.
validation:
  - Dva nováčci projdou kontrolní seznam zaučení, aniž by se museli ptát v chatu.
decisions:
  - date: 2026-09-10
    decision: Znalostní báze je modul Organizace, ne wiki jednoho člověka.
    rationale: Agenti i kolegové čtou stejný zdroj.
